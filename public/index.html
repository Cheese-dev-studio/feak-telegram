<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feak Telegram</title>
<script src="/socket.io/socket.io.js"></script>
<style>
    :root {
        --bg-color: #0e1621;
        --chat-bg: #0e1621;
        --sidebar-bg: #17212b;
        --text-color: #f5f5f5;
        --text-secondary: #8293a1;
        --accent-color: #2b5278;
        --message-bg: #182533;
        --hover-color: rgba(255,255,255,0.07);
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        overflow: hidden;
    }

    /* Экран ввода имени */
    .name-gate {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: var(--bg-color);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
    }
    .name-gate-box {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 320px;
    }
    .name-gate input {
        width: 100%;
        background-color: var(--sidebar-bg);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 12px 15px;
        border-radius: 8px;
        color: white;
        font-size: 15px;
        outline: none;
    }
    .name-gate button {
        width: 100%;
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
    }

    /* Главный макет (Сайдбар + Чат) */
    .app-layout {
        display: none;
        width: 100vw;
        height: 100vh;
        flex-direction: row;
    }

    /* Сайдбар (Список чатов) */
    .sidebar {
        width: 320px;
        height: 100%;
        background-color: var(--sidebar-bg);
        border-right: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
    }
    .sidebar-header {
        padding: 20px;
        font-weight: bold;
        font-size: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        background-color: var(--message-bg);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .contact-list {
        flex: 1;
        overflow-y: auto;
    }
    .contact {
        padding: 15px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background-color 0.2s;
        border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .contact:hover {
        background-color: var(--hover-color);
    }
    .contact.active {
        background-color: var(--accent-color);
    }
    .contact-avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background-color: #2b5278;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 16px;
        color: white;
    }
    .contact-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .contact-name {
        font-weight: 600;
        font-size: 15px;
    }
    .contact-preview {
        font-size: 13px;
        color: var(--text-secondary);
    }
    .contact.active .contact-preview {
        color: #cfe6ff;
    }

    /* Правая часть (Окно чата) */
    .chat-container {
        flex: 1;
        height: 100%;
        background-color: var(--chat-bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .chat-header {
        padding: 15px 20px;
        background-color: var(--message-bg);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .header-btn {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: var(--text-secondary);
        font-size: 11px;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
    }
    .header-btn:hover {
        background: rgba(255,255,255,0.1);
        color: #fff;
    }
    .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #e53935;
        display: inline-block;
        margin-right: 6px;
        transition: background 0.3s;
    }
    .status-dot.online { background: #4caf50; }
    
    .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .message {
        background-color: var(--message-bg);
        padding: 10px 15px;
        border-radius: 10px;
        max-width: 70%;
        align-self: flex-start;
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .message.own {
        align-self: flex-end;
        background-color: var(--accent-color);
    }
    .message-author {
        font-size: 12px;
        color: #52b8ff;
        margin-bottom: 4px;
        font-weight: 600;
    }
    .message.own .message-author { color: #cfe6ff; }
    .message-text {
        font-size: 14px;
        line-height: 1.4;
        word-break: break-word;
        white-space: pre-wrap;
    }
    .message-text a { color: #4ea4f3; text-decoration: underline; }
    .message-time {
        font-size: 10px;
        color: var(--text-secondary);
        margin-top: 4px;
        text-align: right;
    }
    .chat-input-area {
        padding: 15px;
        background-color: #17212b;
        display: flex;
        gap: 10px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    .chat-input-area input {
        flex: 1;
        background-color: #0e1621;
        border: 1px solid rgba(255,255,255,0.08);
        padding: 12px 15px;
        border-radius: 8px;
        color: white;
        font-size: 14px;
        outline: none;
    }
    .chat-input-area button {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 0 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
    .chat-input-area button:hover { background-color: #366596; }
    .empty-hint {
        color: var(--text-secondary);
        font-size: 13px;
        text-align: center;
        margin-top: 40px;
    }
</style>
</head>
<body>

<!-- Экран входа -->
<div class="name-gate" id="nameGate">
    <div class="name-gate-box">
        <div style="font-weight:bold; font-size:20px; margin-bottom:4px; text-align:center;">Вход в Feak Telegram</div>
        <input type="text" id="nameInput" placeholder="Ваше имя" maxlength="30">
        <button id="nameSubmit">Войти</button>
        <div id="nameError" style="color:#ff6b6b; font-size:13px; text-align:center;"></div>
    </div>
</div>

<!-- Основное приложение с боковой панелью -->
<div class="app-layout" id="appLayout">
    <!-- Сайдбар с чатами -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Чаты</span>
            <span id="meLabel" style="font-size: 12px; color: var(--text-secondary); font-weight: normal;"></span>
        </div>
        <div class="contact-list">
            <div class="contact active" data-room="teacher" data-title="Учитель">
                <div class="contact-avatar" style="background-color: #e53935;">👨‍🏫</div>
                <div class="contact-info">
                    <div class="contact-name">Учитель</div>
                    <div class="contact-preview">Школьный проект</div>
                </div>
            </div>
            <div class="contact" data-room="friend" data-title="Друг (Daler)">
                <div class="contact-avatar" style="background-color: #43a047;">👨‍💻</div>
                <div class="contact-info">
                    <div class="contact-name">Daler</div>
                    <div class="contact-preview">Личный чат</div>
                </div>
            </div>
            <div class="contact" data-room="family" data-title="Родные">
                <div class="contact-avatar" style="background-color: #fb8c00;">🏠</div>
                <div class="contact-info">
                    <div class="contact-name">Родные</div>
                    <div class="contact-preview">Семейный чат</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Окно выбранного чата -->
    <div class="chat-container">
        <div class="chat-header">
            <span><span class="status-dot" id="statusDot"></span>Чат: <span id="roomTitle" style="color:#52b8ff;">Учитель</span></span>
            <div class="header-actions">
                <button class="header-btn" id="changeNameBtn">Сменить имя</button>
                <button class="header-btn" id="clearChatBtn">Очистить</button>
            </div>
        </div>
        <div class="chat-messages" id="messageContainer">
            <div class="empty-hint" id="emptyHint">Сообщений пока нет — напишите первым.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Введите сообщение..." maxlength="2000">
            <button id="sendButton">Отправить</button>
        </div>
    </div>
</div>

<script>
(function () {
    const NAME_KEY = "feak_tg_name";
    const socket = io();

    let allMessages = [];
    let myName = localStorage.getItem(NAME_KEY) || "";
    let currentRoom = "teacher"; // Комната по умолчанию

    const nameGate = document.getElementById("nameGate");
    const nameInput = document.getElementById("nameInput");
    const nameSubmit = document.getElementById("nameSubmit");
    const nameError = document.getElementById("nameError");
    
    const appLayout = document.getElementById("appLayout");
    const meLabel = document.getElementById("meLabel");
    const roomTitle = document.getElementById("roomTitle");
    const messageContainer = document.getElementById("messageContainer");
    const emptyHint = document.getElementById("emptyHint");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const changeNameBtn = document.getElementById("changeNameBtn");
    const clearChatBtn = document.getElementById("clearChatBtn");
    const statusDot = document.getElementById("statusDot");
    const contacts = document.querySelectorAll(".contact");

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function linkify(escapedText) {
        return escapedText.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function formatTime(ts) {
        if (!ts) return "";
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function enterApp(name) {
        myName = name;
        localStorage.setItem(NAME_KEY, name);
        nameGate.style.display = "none";
        appLayout.style.display = "flex";
        meLabel.textContent = name;
        switchRoom(currentRoom, "Учитель");
    }

    function switchRoom(roomCode, roomName) {
        currentRoom = roomCode;
        roomTitle.textContent = roomName;
        socket.emit("join_room", { name: myName, room: currentRoom });
    }

    // Клик по контактам в сайдбаре
    contacts.forEach(contact => {
        contact.addEventListener("click", () => {
            contacts.forEach(c => c.classList.remove("active"));
            contact.classList.add("active");
            const roomCode = contact.getAttribute("data-room");
            const roomTitleText = contact.getAttribute("data-title");
            switchRoom(roomCode, roomTitleText);
        });
    });

    nameSubmit.addEventListener("click", () => {
        const name = nameInput.value.trim();
        if (!name) {
            nameError.textContent = "Пожалуйста, введите ваше имя";
            return;
        }
        enterApp(name);
    });

    nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") nameSubmit.click();
    });

    changeNameBtn.addEventListener("click", () => {
        appLayout.style.display = "none";
        nameGate.style.display = "flex";
        nameInput.value = myName;
    });

    clearChatBtn.addEventListener("click", () => {
        if (confirm("Очистить историю сообщений в этом чате?")) {
            socket.emit("clear_messages");
        }
    });

    function renderMessages() {
        messageContainer.innerHTML = "";
        if (!allMessages.length) {
            messageContainer.appendChild(emptyHint);
            return;
        }
        allMessages.forEach((data) => {
            const div = document.createElement("div");
            div.className = "message" + (data.author === myName ? " own" : "");
            const safeText = linkify(escapeHtml(data.text || ""));
            div.innerHTML =
                '<div class="message-author">' + escapeHtml(data.author || "???") + '</div>' +
                '<div class="message-text">' + safeText + '</div>' +
                '<div class="message-time">' + formatTime(data.ts) + '</div>';
            messageContainer.appendChild(div);
        });
        messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        socket.emit("send_message", {
            author: myName,
            text: text
        });

        userInput.value = "";
    }

    socket.on("connect", () => {
        statusDot.classList.add("online");
        if (myName) {
            socket.emit("join_room", { name: myName, room: currentRoom });
        }
    });

    socket.on("disconnect", () => {
        statusDot.classList.remove("online");
    });

    socket.on("init_messages", (msgs) => {
        allMessages = msgs;
        renderMessages();
    });

    socket.on("new_message", (msg) => {
        allMessages.push(msg);
        renderMessages();
    });

    sendButton.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
    });

    if (myName) {
        enterApp(myName);
    }
})();
</script>
</body>
</html>
